<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakGrove</title>
<style>
  :root { --bg:#fbfaf6; --fg:#1d2a22; --muted:#5b6b61; --accent:#0e3d28; --line:#dfe4dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111814; --fg:#e7ede8; --muted:#a3b2a8; --accent:#7fd0a2; --line:#2a352e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { color: var(--accent); margin-bottom: 4px; }
  h2 { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 20px; }
  .meta { color: var(--muted); }
  nav a { color: var(--accent); margin-right: 12px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid var(--line); padding: 8px; vertical-align: top; text-align: left; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>SpeakGrove</h1>
<p>A language school in your pocket: CEFR-based courses with dialogues, grammar, reading, writing and speaking practice, and a live AI tutor.</p>
<p><a href="privacy/">Privacy Policy</a> · <a href="terms/">Terms of Use</a> · <a href="privacy/#delete">Delete your account</a></p>
<p class="meta">Contact: <a href="mailto:citrushelp@gmail.com">citrushelp@gmail.com</a></p>
</main>
</body>
</html>
